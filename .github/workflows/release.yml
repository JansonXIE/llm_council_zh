name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Update version to match tag
        shell: bash
        working-directory: frontend
        run: |
          # Remove 'v' prefix from tag
          VERSION=${GITHUB_REF_NAME#v}
          echo "Setting version to $VERSION"
          
          # Update package.json
          npm version $VERSION --no-git-tag-version
          
          # Update tauri.conf.json
          node -e "const fs=require('fs'); let data=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')); data.version='$VERSION'; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(data, null, 2));"
          
          # Update Cargo.toml
          node -e "const fs=require('fs'); let data=fs.readFileSync('src-tauri/Cargo.toml', 'utf8'); data=data.replace(/version = \".*\"/, 'version = \"' + '$VERSION' + '\"'); fs.writeFileSync('src-tauri/Cargo.toml', data);"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LLM Council ${{ github.ref_name }}'
          releaseBody: |
            ## LLM Council ${{ github.ref_name }}

            See the assets to download and install this version.

            - **Windows**: Download the `.exe` installer (NSIS setup wizard)
            - **Linux (Debian/Ubuntu)**: Download the `.deb` package
            - **Linux (portable)**: Download the `.AppImage` — no install needed
          releaseDraft: false
          prerelease: false
          tauriPath: frontend/src-tauri

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Update version to match tag
        shell: bash
        working-directory: frontend
        run: |
          # Remove 'v' prefix from tag
          VERSION=${GITHUB_REF_NAME#v}
          echo "Setting version to $VERSION"
          
          # Update package.json
          npm version $VERSION --no-git-tag-version
          
          # Update tauri.conf.json
          node -e "const fs=require('fs'); let data=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')); data.version='$VERSION'; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(data, null, 2));"
          
          # Update Cargo.toml
          node -e "const fs=require('fs'); let data=fs.readFileSync('src-tauri/Cargo.toml', 'utf8'); data=data.replace(/version = \".*\"/, 'version = \"' + '$VERSION' + '\"'); fs.writeFileSync('src-tauri/Cargo.toml', data);"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LLM Council ${{ github.ref_name }}'
          releaseBody: |
            ## LLM Council ${{ github.ref_name }}

            See the assets to download and install this version.

            - **Windows**: Download the `.exe` installer (NSIS setup wizard)
            - **Linux (Debian/Ubuntu)**: Download the `.deb` package
            - **Linux (portable)**: Download the `.AppImage` — no install needed
          releaseDraft: false
          prerelease: false
          tauriPath: frontend/src-tauri